name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - name: Check translations
        run: node tools/check-i18n.mjs
      - name: Build
        run: node build.mjs
        env:
          # Override with repository variables SITE_BASE / SITE_URL when a custom domain is attached.
          SITE_BASE: ${{ vars.SITE_BASE || '/BAYOUWELLNESS/' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://minaikhansaltanat-prog.github.io/BAYOUWELLNESS' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
